[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linumpy-manual-align"
version = "0.1.0"
description = "CLI application (napari viewer) for manual slice alignment correction in linumpy serial histology pipelines"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [
    { name = "LINUM Lab" },
]
keywords = ["napari", "microscopy", "registration", "alignment", "serial-histology"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "napari[all]>=0.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "SimpleITK>=2.3",
]

[project.optional-dependencies]
zarr = ["ome-zarr>=0.9"]
dev = ["pytest", "ruff>=0.11", "ty>=0.0.1a1"]

[project.scripts]
linumpy-manual-align = "linumpy_manual_align.__main__:main"

[project.urls]
Homepage = "https://github.com/linum-uqam/linumpy-manual-align"
Repository = "https://github.com/linum-uqam/linumpy-manual-align"

[tool.hatch.build.targets.wheel]
packages = ["src/linumpy_manual_align"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# --- ruff ---
[tool.ruff]
target-version = "py314"
line-length = 127
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PTH", "N", "PERF", "FLY", "G", "D", "ANN", "ARG", "ERA", "FURB"]
# N813:   SimpleITK as sitk is the universal Python convention.
# ANN401: Any is legitimately unavoidable in several callback/override signatures.
# ANN204: __init__ return type is always None by convention; annotating it adds noise.
ignore = ["N813", "ANN401", "ANN204"]
extend-select = ["D417"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Test files: annotations, docstrings, unused-argument checks, naming, and commented-out
# code are not required in the test suite.
"tests/**" = ["ANN", "D", "ARG", "N", "ERA"]
# cs_server.py is a standalone server-side script uploaded via SSH; it is not checked
# by ty and does not need annotation/docstring coverage.
"src/linumpy_manual_align/remote/cs_server.py" = ["ANN", "D"]
# Qt override methods and Protocol stubs must use Qt's camelCase naming convention.
"src/linumpy_manual_align/ui/**" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["linumpy_manual_align"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# SimpleITK (SWIG) and transitive pydantic deprecations are noisy but outside this repo.
filterwarnings = [
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
    "ignore:.*json_encoders.*:pydantic.warnings.PydanticDeprecatedSince20",
]

[tool.ruff.format]
# Use default (black-compatible) formatting

# --- ty ---
[tool.ty.src]
# cs_server.py is a standalone server-side script uploaded via SSH; it imports
# linumpy which is not a local dependency and must not be type-checked here.
exclude = ["src/linumpy_manual_align/remote/cs_server.py"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["src"]

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.ty.analysis]
# Prefer real typings for numpy/scipy/SimpleITK in app code; keep Any only for UI/napari boundaries.
replace-imports-with-any = ["napari.**", "qtpy.**", "ome_zarr.**"]

# Tests import project internals with pytest fixtures; silence false-positive unresolved refs.
[[tool.ty.overrides]]
include = ["tests/**", "**/test_*.py", "**/conftest.py"]
[tool.ty.overrides.rules]
possibly-unresolved-reference = "ignore"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "import-linter>=2.12",
    "pytest-cov>=7.1",
]

# --- import-linter ---
[tool.importlinter]
root_package = "linumpy_manual_align"
include_external_packages = false
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Strict architecture pyramid"
type = "layers"
layers = [
    "linumpy_manual_align.ui",
    "linumpy_manual_align.settings_runtime",
    "linumpy_manual_align.settings",
    "linumpy_manual_align.remote",
    "linumpy_manual_align.state",
    "linumpy_manual_align.io",
    "linumpy_manual_align.contracts",
]
ignore_imports = [
    # Step 1 — settings boundary decoupling: remove cross_section → settings import
    "linumpy_manual_align.remote.cross_section -> linumpy_manual_align.settings",
    # Step 1 — settings boundary decoupling: pass nudge px from ui instead of settings_runtime import
    "linumpy_manual_align.remote.cross_section -> linumpy_manual_align.settings_runtime",
    # Step 1 — settings boundary decoupling: read env/parameter in cs_script instead of settings import
    "linumpy_manual_align.remote.cs_script -> linumpy_manual_align.settings",
]

[[tool.importlinter.contracts]]
name = "Layers must not import composition roots"
type = "forbidden"
source_modules = [
    "linumpy_manual_align.contracts",
    "linumpy_manual_align.io",
    "linumpy_manual_align.remote",
    "linumpy_manual_align.ui",
    "linumpy_manual_align.state",
    "linumpy_manual_align.settings",
    "linumpy_manual_align.settings_runtime",
]
forbidden_modules = [
    "linumpy_manual_align.api",
    "linumpy_manual_align.__main__",
]

[[tool.importlinter.contracts]]
name = "Contracts layer isolation"
type = "forbidden"
source_modules = ["linumpy_manual_align.contracts"]
forbidden_modules = [
    "linumpy_manual_align.io",
    "linumpy_manual_align.state",
    "linumpy_manual_align.remote",
    "linumpy_manual_align.settings",
    "linumpy_manual_align.settings_runtime",
    "linumpy_manual_align.ui",
]

[[tool.importlinter.contracts]]
name = "IO layer isolation"
type = "forbidden"
source_modules = ["linumpy_manual_align.io"]
forbidden_modules = [
    "linumpy_manual_align.state",
    "linumpy_manual_align.remote",
    "linumpy_manual_align.settings",
    "linumpy_manual_align.settings_runtime",
    "linumpy_manual_align.ui",
]

[[tool.importlinter.contracts]]
name = "State layer isolation"
type = "forbidden"
source_modules = ["linumpy_manual_align.state"]
forbidden_modules = [
    "linumpy_manual_align.remote",
    "linumpy_manual_align.settings",
    "linumpy_manual_align.settings_runtime",
    "linumpy_manual_align.ui",
]

[[tool.importlinter.contracts]]
name = "Remote layer isolation"
type = "forbidden"
source_modules = ["linumpy_manual_align.remote"]
forbidden_modules = [
    "linumpy_manual_align.settings",
    "linumpy_manual_align.settings_runtime",
    "linumpy_manual_align.ui",
]
ignore_imports = [
    # Step 1 — settings boundary decoupling: remove cross_section → settings import
    "linumpy_manual_align.remote.cross_section -> linumpy_manual_align.settings",
    # Step 1 — settings boundary decoupling: pass nudge px from ui instead of settings_runtime import
    "linumpy_manual_align.remote.cross_section -> linumpy_manual_align.settings_runtime",
    # Step 1 — settings boundary decoupling: read env/parameter in cs_script instead of settings import
    "linumpy_manual_align.remote.cs_script -> linumpy_manual_align.settings",
]

[[tool.importlinter.contracts]]
name = "Settings layer isolation"
type = "forbidden"
source_modules = ["linumpy_manual_align.settings"]
forbidden_modules = [
    "linumpy_manual_align.settings_runtime",
    "linumpy_manual_align.ui",
]

[[tool.importlinter.contracts]]
name = "UI layer isolation"
type = "forbidden"
source_modules = ["linumpy_manual_align.ui"]
forbidden_modules = [
    "linumpy_manual_align.api",
    "linumpy_manual_align.__main__",
]
